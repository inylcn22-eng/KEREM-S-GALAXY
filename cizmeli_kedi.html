<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mola Ustası | Çizmeli Kedi</title>
    <style>
        body {
            background: linear-gradient(135deg, #eee5ff, #fff0f5, #e0f5e9);
            font-family: Arial, sans-serif;
            color: #49345f;
            margin: 0;
            padding: 30px 15px;
        }
        .kart {
            background: rgba(255, 255, 255, 0.88);
            max-width: 600px;
            margin: 0 auto;
            padding: 35px;
            border-radius: 30px;
            box-shadow: 0 8px 25px rgba(80, 60, 130, 0.12);
            text-align: center;
        }
        img {
            width: 150px;
            height: 150px;
            border-radius: 25px;
            object-fit: cover;
        }
        .geri {
            display: inline-block;
            margin-bottom: 15px;
            text-decoration: none;
            color: #8155a6;
            font-weight: bold;
        }
        .zaman-ekrani {
            font-size: 56px;
            font-weight: bold;
            color: #8155a6;
            margin: 25px 0;
            background: #f6eeff;
            padding: 20px;
            border-radius: 22px;
        }
        button {
            background: #9568bd;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 14px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin: 5px;
        }
        button:hover {
            background: #70458f;
        }
    </style>
</head>
<body>
    <div class="kart">
        <a href="index.html" class="geri">← Ana Sayfaya Dön</a><br>
        <img src="cizmeli_kedi.png" alt="Çizmeli Kedi" onerror="this.outerHTML='<div style=\'font-size:80px;\'>🐱</div>'">
        <h1>🐱 Mola Ustası</h1>
        <p id="durumMetni">"Zzz... Çalışma bitince şekerleme ve mola zamanı!"</p>

        <div class="zaman-ekrani" id="pomodoro">25:00</div>

        <div>
            <button onclick="baslat()">Başlat ▶️</button>
            <button onclick="durdur()">Duraklat ⏸️</button>
            <button onclick="modAyarla(25, 'Ders Zamanı! Odaklan doktor bey 📚')">25 Dk Ders</button>
            <button onclick="modAyarla(5, 'Mola Zamanı! Dinlenmeyi hak ettin ☕')">5 Dk Mola</button>
        </div>
    </div>

    <script>
        let kalanSaniye = 25 * 60;
        let zamanlayici = null;

        function ekraniGuncelle() {
            const dk = Math.floor(kalanSaniye / 60);
            const sn = kalanSaniye % 60;
            document.getElementById("pomodoro").innerText = 
                `${dk < 10 ? '0' + dk : dk}:${sn < 10 ? '0' + sn : sn}`;
        }

        function baslat() {
            if (zamanlayici) return;
            zamanlayici = setInterval(() => {
                if (kalanSaniye > 0) {
                    kalanSaniye--;
                    ekraniGuncelle();
                } else {
                    durdur();
                    alert("Süre doldu! Mola Ustası seni çağırıyor 🐱✨");
                }
            }, 1000);
        }

        function durdur() {
            clearInterval(zamanlayici);
            zamanlayici = null;
        }

        function modAyarla(dakika, mesaj) {
            durdur();
            kalanSaniye = dakika * 60;
            document.getElementById("durumMetni").innerText = mesaj;
            ekraniGuncelle();
        }
    </script>
</body>
</html>
