<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neşe Kaynağı | Mojito</title>
    <style>
        body {
            background: linear-gradient(135deg, #eee5ff, #fff0f5, #e0f5e9);
            font-family: Arial, sans-serif;
            color: #49345f;
            margin: 0;
            padding: 30px 15px;
        }
        .kart {
            background: rgba(255, 255, 255, 0.88);
            max-width: 600px;
            margin: 0 auto;
            padding: 35px;
            border-radius: 30px;
            box-shadow: 0 8px 25px rgba(80, 60, 130, 0.12);
            text-align: center;
        }
        img {
            width: 150px;
            height: 150px;
            border-radius: 25px;
            object-fit: cover;
        }
        .geri {
            display: inline-block;
            margin-bottom: 15px;
            text-decoration: none;
            color: #8155a6;
            font-weight: bold;
        }
        .moral-kutu {
            background: #e9fbf0;
            border: 2px solid #bce8cd;
            padding: 25px;
            border-radius: 20px;
            margin: 25px 0;
            font-size: 18px;
            line-height: 1.6;
            color: #365e47;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        button {
            background: #67b588;
            color: white;
            border: none;
            padding: 15px 28px;
            border-radius: 16px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover {
            background: #4e966d;
        }
    </style>
</head>
<body>
    <div class="kart">
        <a href="index.html" class="geri">← Ana Sayfaya Dön</a><br>
        <img src="mojito.jpg" alt="Mojito" onerror="this.outerHTML='<div style=\'font-size:80px;\'>🍹</div>'">
        <h1>🍹 Neşe Kaynağı</h1>
        <p>"Zorlandığında buraya gel, enerjini tazeleyelim!"</p>

        <div class="moral-kutu" id="moralMesaji">
            Butona bas ve bugünün pozitif enerjisini kap! ✨
        </div>

        <button onclick="yeniMoral()">Enerji Yükle 🍋✨</button>
    </div>

    <script>
        const moraller = [
            "Derin bir nefes al! Şu an çözdüğün her zor soru, gelecekte bir hastanın yüzündeki gülümsemeye dönüşecek. 🩺💚",
            "Bugün kendine bir kahve veya soğuk bir içecek ısmarla. Çok çalışıyorsun ve bunu sonuna kadar hak ediyorsun! 🍹",
            "Unutma: En büyük destekçin her zaman arkanda ve sana sonsuz güveniyor! 💜",
            "Bazen yavaşlamak durmak değildir. Dinlen, enerjini topla ve kaldığın yerden devam et Doktor Yağız Kerem! 🌟",
            "2027'de o fakülte kapısından içeri girdiğin an bugünkü tüm yorgunluğun uçup gidecek! 🎓✨"
        ];

        function yeniMoral() {
            const rastgele = Math.floor(Math.random() * moraller.length);
            document.getElementById("moralMesaji").innerText = moraller[rastgele];
        }
    </script>
</body>
</html>
